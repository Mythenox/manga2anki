[workspace]
authors = ["Mythenox <aandrews0601@gmail.com>"]
channels = ["conda-forge"]
name = "manga_to_anki"
platforms = [{platform = "linux-64", cuda = "13.3"},
]
version = "0.1.0"

[tasks]
word = "python3 word.py"

[dependencies]
scipy = ">=1.18.0,<2"
matplotlib = ">=3.11.0,<4"
scikit-image = ">=0.26.0,<0.27"
torchvision = ">=0.27.1,<0.28"
numpy = ">=2.5.0,<3"
pytorch-gpu = ">=2.12.1,<3"
python = ">=3.14.6,<3.15"
transformers = ">=5.14.1,<6"
sentence-transformers = ">=5.6.1,<6"
pandas = ">=3.0.5,<4"

[pypi-dependencies]
opencv-python = ">=5.0.0.93, <6"
manga-ocr = ">=0.1.16, <0.2"
sudachipy = ">=0.6.11, <0.7"
sudachidict-core = ">=20260723, <20260724"
genanki = ">=0.13.1, <0.14"
rhoknp = ">=1.8.0, <2"
jamdict = ">=0.1a11.post2, <0.1a12"
jamdict-data = ">=1.5, <2"
